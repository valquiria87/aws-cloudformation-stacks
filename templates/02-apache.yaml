AWSTemplateFormatVersion: '2010-09-09'
Description: Cria uma instância Amazon Linux 2023 e instala o servidor web Apache.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Selecione a VPC onde a instância será criada.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Selecione uma subnet pertencente à VPC informada.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro]
    Description: Tipo da instância EC2.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI Amazon Linux 2023 mais recente disponível na região.

Resources:
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Sem acesso de entrada; Apache será instalado para a etapa seguinte.
      VpcId: !Ref VpcId
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf update -y
          dnf install -y httpd
          systemctl enable --now httpd
          echo "<h1>Olá! Apache instalado via AWS CloudFormation.</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: Webserver-Apache

Outputs:
  InstanceId:
    Description: ID da instância EC2.
    Value: !Ref EC2Instance
  PrivateIp:
    Description: Endereço IPv4 privado da instância.
    Value: !GetAtt EC2Instance.PrivateIp
  SecurityGroupId:
    Description: Grupo de segurança associado à instância.
    Value: !Ref EC2SecurityGroup
  ApacheStatus:
    Description: O Apache é instalado e habilitado pelo UserData durante a inicialização.
    Value: Apache configurado; sem regra de entrada HTTP neste template.
