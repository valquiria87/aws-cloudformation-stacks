AWSTemplateFormatVersion: '2010-09-09'
Description: Cria um servidor Apache EC2 e libera HTTP pela porta 80.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Selecione a VPC onde os recursos serão criados.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Selecione uma subnet pública pertencente à VPC informada.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro]
    Description: Tipo da instância EC2.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI Amazon Linux 2023 mais recente disponível na região.

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite tráfego HTTP público na porta 80.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Acesso HTTP público ao servidor web.
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref WebSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf update -y
          dnf install -y httpd
          systemctl enable --now httpd
          echo "<h1>Olá! Servidor Apache protegido por Security Group.</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: Webserver-Firewall

Outputs:
  InstanceId:
    Description: ID da instância EC2.
    Value: !Ref EC2Instance
  PublicIp:
    Description: Endereço IPv4 público da instância.
    Value: !GetAtt EC2Instance.PublicIp
  WebsiteURL:
    Description: URL HTTP; a subnet precisa ter rota para um Internet Gateway.
    Value: !Sub 'http://${EC2Instance.PublicDnsName}'
  SecurityGroupId:
    Description: ID do grupo de segurança que libera HTTP.
    Value: !Ref WebSecurityGroup
